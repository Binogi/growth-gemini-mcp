name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # dist/ and bundle/ are tracked. The Claude Code plugins ship
      # bundle/gemini-mcp.mjs as a single file (docs/binogi-fork.md), so a clean
      # build must reproduce both exactly.
      - run: npm run build
      - name: dist and bundle match src
        run: |
          if [ -n "$(git status --porcelain -- dist bundle)" ]; then
            echo "dist/ or bundle/ is out of date. Run 'npm run build' and commit the result." >&2
            git status --porcelain -- dist bundle >&2
            exit 1
          fi
      - name: bundle runs with no node_modules
        run: scripts/smoke-bundle.sh
